set_timer:
  name: 设置定时关机
  description: 设置风扇定时关机时间（0-8小时）
  target:
    entity:
      integration: greexfan
      domain: fan
  fields:
    hours:
      name: 小时数
      description: 0 = 取消定时
      required: true
      selector:
        number:
          min: 0
          max: 8
          step: 1
          unit_of_measurement: 小时
